<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 160" width="860" height="160">
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1677ff" />
      <stop offset="100%" stop-color="#4096ff" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8c8c8c" />
    </marker>
  </defs>

  <!-- Box 1: UI -->
  <rect x="10" y="20" width="180" height="60" rx="8" fill="url(#boxGrad)" stroke="#0958d9" stroke-width="2"/>
  <text x="100" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">UI (React/AntD)</text>

  <!-- Box 2: Hooks -->
  <rect x="230" y="20" width="180" height="60" rx="8" fill="url(#boxGrad)" stroke="#0958d9" stroke-width="2"/>
  <text x="320" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Hooks (useCrud)</text>

  <!-- Box 3: Request -->
  <rect x="450" y="20" width="180" height="60" rx="8" fill="url(#boxGrad)" stroke="#0958d9" stroke-width="2"/>
  <text x="540" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Request (@umijs/max)</text>

  <!-- Box 4: API -->
  <rect x="670" y="20" width="180" height="60" rx="8" fill="url(#boxGrad)" stroke="#0958d9" stroke-width="2"/>
  <text x="760" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">API (terra-ems)</text>

  <!-- Linear Arrows -->
  <line x1="190" y1="50" x2="225" y2="50" stroke="#8c8c8c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="410" y1="50" x2="445" y2="50" stroke="#8c8c8c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="630" y1="50" x2="665" y2="50" stroke="#8c8c8c" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Return Arrow (API to UI) -->
  <path d="M 760 80 Q 760 130 740 130 L 120 130 Q 100 130 100 85" fill="none" stroke="#8c8c8c" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="6,4"/>
  <text x="430" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8c8c8c" text-anchor="middle">Response Data Loop / 响应数据回路</text>
</svg>
